services:
  glucose-control-service:
    image: glucose-control-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      glucose-db:
        condition: service_healthy
        restart: true
    environment:
      - CORS_FRONTEND_URL=http://localhost:5173
      - SPRING_DATASOURCE_URL=jdbc:postgresql://glucose-db/glucose_control_service
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres

  glucose-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glucose_control_service
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./infrastructure/postgres/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      - postgresql-data:/var/lib/postgresql/18/main
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgresql-data: